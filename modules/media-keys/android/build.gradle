plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'br.com.movcode.painel208.mediakeys'
version = '0.1.0'

android {
  namespace "br.com.movcode.painel208.mediakeys"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Regras do R8 para o SDK do Spotify (veja o arquivo).
    consumerProguardFiles "proguard-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

// Spotify App Remote (navegar e tocar playlists do Spotify).
// O .aar não está no Maven Central: fica no repositório local ./maven,
// registrado para todos os projetos pelo plugin ./plugins/withLocalMaven (app.json).
dependencies {
  implementation "com.spotify.android:spotify-app-remote:0.8.0@aar"
  // O App Remote usa Gson para conversar com o app do Spotify.
  implementation "com.google.code.gson:gson:2.11.0"
}
